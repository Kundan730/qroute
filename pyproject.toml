[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qroute"
version = "0.1.0"
description = "Quantum-inspired (QPSO / QIEA) intelligent traffic route optimisation platform for SIH 2026 PS 26137"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SIH 26137 Team" }]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "networkx>=3.3",
  "numba>=0.60",
  "ortools>=9.10",
  "osmnx>=2.0",
  "vrplib>=2.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "matplotlib>=3.9",
  "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
qroute = "qroute.cli.main:app"

[tool.setuptools.packages.find]
include = ["qroute*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
